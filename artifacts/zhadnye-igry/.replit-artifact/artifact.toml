kind = "web"
previewPath = "/"
title = "Жадные игры"
description = "Мобильный русскоязычный личный трекер жизни в духе MMORPG: профиль персонажа, дневные записи, история и простые тренды с данными, сохранёнными в браузере."
version = "1.0.0"
id = "artifacts/zhadnye-igry"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20028

[services.development]
run = "pnpm --filter @workspace/zhadnye-igry run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zhadnye-igry", "run", "build" ]
serve = "static"
publicDir = "artifacts/zhadnye-igry/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20028"
BASE_PATH = "/"
